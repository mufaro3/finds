services:
  main:
    build: .
    volumes:
      - .:/finds
    working_dir: /finds
    command: python3 -m finds.main
    mem_limit: 4g
    stdin_open: true
    tty: true

  validation:
    build: .
    volumes:
      - .:/finds
    working_dir: /finds
    command: python3 -m finds.validation
    mem_limit: 4g
    stdin_open: true
    tty: true