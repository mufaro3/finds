services:
  dev: &dev
    build: .
    container_name: c-dev

    volumes:
      - .:/workspace

    working_dir: /workspace

    mem_limit: 4g
    environment:
      - PYTHONUNBUFFERED=1

    stdin_open: true
    tty: true

  jupyter:
    <<: *dev
    ports:
      - "8888:8888"
    command: >
      python3 -m jupyterlab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
